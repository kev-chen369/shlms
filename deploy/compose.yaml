services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shlms_test
      POSTGRES_USER: shlms
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlms -d shlms_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - shlms_postgres:/var/lib/postgresql/data

volumes:
  shlms_postgres:
